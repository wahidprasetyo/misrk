<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="https://i.ibb.co.com/WN59bgvJ/logo-sekolah.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Memori - MIS Roudlotul Khuffadz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #F9F9F6;
            --text-dark: #1A1A1A;
            --text-muted: #666666;
            --green-school: #17a24b;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-dark); overflow-x: hidden; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        
        .navbar { padding: 24px 40px; background: transparent; }
        .navbar-brand { font-weight: 700; font-size: 1.1rem; letter-spacing: -0.5px; color: var(--text-dark) !important; }
        .nav-link { color: var(--text-dark) !important; font-weight: 500; font-size: 0.95rem; margin: 0 16px; opacity: 0.8; transition: opacity 0.3s ease; position: relative; }
        .nav-link:hover { opacity: 1; }
        .nav-link:not(.btn-green-school)::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -4px; left: 0; background-color: var(--green-school); transition: width 0.3s ease-in-out; }
        .nav-link:not(.btn-green-school):hover::after { width: 100%; }
        .btn-green-school { background-color: #17a24b !important; color: #fff !important; border-radius: 50px; padding: 10px 24px; font-weight: 500; transition: transform 0.2s; display: inline-block; }
        .btn-green-school:hover { background-color: #148f3f !important; transform: scale(1.05); }

        .gallery-wrapper { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px 0 80px; position: relative; }
        .gallery-header { text-align: center; margin-bottom: 50px; }
        .gallery-header h1 { font-size: 4rem; font-weight: 700; letter-spacing: -1.5px; color: var(--text-dark); }

        .gallery-container { position: relative; width: 100%; height: 450px; display: flex; align-items: center; justify-content: center; perspective: 1000px; }
        
        .gallery-card { position: absolute; width: 320px; height: 420px; background: #ffffff; padding: 16px; padding-bottom: 40px; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1); cursor: pointer; user-select: none; border: 1px solid rgba(0,0,0,0.05); }
        .gallery-card img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; pointer-events: none; }
        .gallery-card:hover { box-shadow: 0 30px 50px rgba(23, 162, 75, 0.15); }

        .card-active { transform: translateX(0) scale(1) rotate(0deg); z-index: 10; opacity: 1; }
        .card-prev-1 { transform: translateX(-45%) scale(0.9) rotate(-8deg); z-index: 5; opacity: 0.85; filter: brightness(0.7); }
        .card-next-1 { transform: translateX(45%) scale(0.9) rotate(8deg); z-index: 5; opacity: 0.85; filter: brightness(0.7); }
        .card-prev-2 { transform: translateX(-80%) scale(0.8) rotate(-16deg); z-index: 4; opacity: 0.6; filter: brightness(0.5); }
        .card-next-2 { transform: translateX(80%) scale(0.8) rotate(16deg); z-index: 4; opacity: 0.6; filter: brightness(0.5); }
        .card-hidden-left { transform: translateX(-110%) scale(0.7) rotate(-24deg); z-index: 1; opacity: 0; pointer-events: none; }
        .card-hidden-right { transform: translateX(110%) scale(0.7) rotate(24deg); z-index: 1; opacity: 0; pointer-events: none; }

        .gallery-controls { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 800px; margin-top: 50px; padding: 0 20px; display: none; /* Disembunyikan saat loading */ }
        .control-btn { background: transparent; border: none; font-size: 1.5rem; color: var(--text-dark); cursor: pointer; transition: transform 0.3s, color 0.3s; }
        .control-btn:hover { color: var(--green-school); transform: scale(1.2); }
        .caption-display { text-align: center; font-size: 0.95rem; color: var(--text-muted); font-style: italic; transition: opacity 0.3s; }

        /* Loader Styles */
        #loader { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; position: absolute; }

        @media (max-width: 768px) {
            .gallery-header h1 { font-size: 2.5rem; }
            .gallery-card { width: 240px; height: 320px; padding: 10px; padding-bottom: 30px; }
            .card-prev-1 { transform: translateX(-50%) scale(0.9) rotate(-6deg); }
            .card-next-1 { transform: translateX(50%) scale(0.9) rotate(6deg); }
            .card-prev-2 { transform: translateX(-85%) scale(0.8) rotate(-12deg); opacity: 0; pointer-events: none;}
            .card-next-2 { transform: translateX(85%) scale(0.8) rotate(12deg); opacity: 0; pointer-events: none;}
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="https://i.ibb.co.com/WN59bgvJ/logo-sekolah.png" alt="Logo" style="width: 36px; margin-right: 12px;">
                MIS ROUDLOTUL KHUFFADZ
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html#tentang">Tentang</a></li>
                    <li class="nav-item"><a class="nav-link" href="materi.html">Materi</a></li>
                    <li class="nav-item"><a class="nav-link" href="panduanguru.html">Guru</a></li>
                    <li class="nav-item ms-4"><a class="nav-link btn-green-school" href="sipintarrk.html">SIPINTAR-RK</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="gallery-wrapper">
        <div class="gallery-header">
            <span class="text-success fw-bold text-uppercase" style="letter-spacing: 2px; font-size: 0.85rem;">Dokumentasi</span>
            <h1>Memori & Karya</h1>
        </div>

        <div class="gallery-container" id="galleryContainer">
            <div id="loader">
                <div class="spinner-border text-success mb-3" role="status" style="width: 3rem; height: 3rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="text-muted fw-medium">Mengambil data memori dari database...</p>
            </div>
        </div>

        <div class="gallery-controls" id="galleryControls">
            <button class="control-btn" id="prevBtn"><i class="fas fa-arrow-left"></i></button>
            <div class="caption-display" id="captionText">Memuat caption...</div>
            <button class="control-btn" id="nextBtn"><i class="fas fa-arrow-right"></i></button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // MASUKKAN URL DEPLOYMENT APPS SCRIPT ANDA DI SINI
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwqR6OME7xKmmY5SUu6NIR4oenUrXiYz3o5VlI9E37Uq4HSGTS1ec10o9S0Fl_qpeXt/exec'; 

        const galleryContainer = document.getElementById('galleryContainer');
        const galleryControls = document.getElementById('galleryControls');
        const captionText = document.getElementById('captionText');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        
        let cards = [];
        let currentIndex = 0;

        async function fetchGalleryData() {
            try {
                const response = await fetch(scriptURL);
                const data = await response.json();

                if (data.galeri && data.galeri.length > 0) {
                    // Hapus loader
                    galleryContainer.innerHTML = ''; 

                    // Render elemen dari database
                    data.galeri.forEach((item) => {
                        const div = document.createElement('div');
                        div.className = 'gallery-card';
                        div.setAttribute('data-caption', item.Caption);
                        div.innerHTML = `<img src="${item.Gambar}" alt="Galeri Sekolah">`;
                        galleryContainer.appendChild(div);
                    });

                    // Inisialisasi kartu setelah di-render
                    cards = document.querySelectorAll('.gallery-card');
                    
                    // Set gambar tengah sebagai fokus awal (jika ganjil ambil nilai tengah persis)
                    currentIndex = Math.floor(cards.length / 2); 
                    
                    setupInteractions();
                    updateGallery();
                    
                    // Munculkan kontrol panah dan teks
                    galleryControls.style.display = 'flex';
                } else {
                    galleryContainer.innerHTML = '<p class="text-muted fs-5">Belum ada dokumentasi yang ditambahkan.</p>';
                }
            } catch (error) {
                console.error("Gagal menarik data:", error);
                galleryContainer.innerHTML = `
                    <div class="text-center text-danger">
                        <i class="fas fa-exclamation-triangle fs-2 mb-3"></i>
                        <p>Gagal memuat galeri. Pastikan koneksi internet stabil dan URL Web App benar.</p>
                    </div>`;
            }
        }

        function updateGallery() {
            cards.forEach((card, index) => {
                card.className = 'gallery-card'; // Reset kelas CSS
                
                let offset = index - currentIndex;

                if (offset === 0) {
                    card.classList.add('card-active');
                    captionText.style.opacity = 0;
                    setTimeout(() => {
                        captionText.textContent = card.getAttribute('data-caption');
                        captionText.style.opacity = 1;
                    }, 300);
                }
                else if (offset === -1) card.classList.add('card-prev-1');
                else if (offset === 1) card.classList.add('card-next-1');
                else if (offset === -2) card.classList.add('card-prev-2');
                else if (offset === 2) card.classList.add('card-next-2');
                else if (offset < -2) card.classList.add('card-hidden-left');
                else if (offset > 2) card.classList.add('card-hidden-right');
            });
        }

        function setupInteractions() {
            prevBtn.addEventListener('click', () => {
                if (currentIndex > 0) {
                    currentIndex--;
                    updateGallery();
                }
            });

            nextBtn.addEventListener('click', () => {
                if (currentIndex < cards.length - 1) {
                    currentIndex++;
                    updateGallery();
                }
            });

            // Klik pada kartu polaroid mana saja akan memindahkannya ke tengah
            cards.forEach((card, index) => {
                card.addEventListener('click', () => {
                    currentIndex = index;
                    updateGallery();
                });
            });
        }

        // Panggil fungsi saat halaman selesai dimuat
        document.addEventListener("DOMContentLoaded", fetchGalleryData);
    </script>
</body>
</html>
